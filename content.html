const cfg={apiKey:"AIzaSyBDzbv1fTRpXfmj3Nz4svl7ALWWARBuY0o",authDomain:"lp-store-23212.firebaseapp.com",projectId:"lp-store-23212",storageBucket:"lp-store-23212.firebasestorage.app",messagingSenderId:"200245726085",appId:"1:200245726085:web:846b39a873c06a1ebc12ec"};if(!firebase.apps.length)firebase.initializeApp(cfg);const db=firebase.firestore(),feed=document.getElementById("feed"),search=document.getElementById("search"),filter=document.getElementById("filter");let records=[];
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function videoId(d){if(d.youtubeVideoId)return d.youtubeVideoId;try{const u=new URL(d.youtubeUrl);if(u.hostname==="youtu.be")return u.pathname.slice(1);if(u.pathname==="/watch")return u.searchParams.get("v")||"";const p=u.pathname.split("/");return p[1]==="embed"||p[1]==="shorts"||p[1]==="live"?p[2]||"":"";}catch(e){return "";}}

search.addEventListener("input",render);filter.addEventListener("change",render);db.collection("noorContent").where("published","==",true).limit(300).onSnapshot(s=>{records=s.docs.map(x=>x.data());records.sort((a,b)=>{const x=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0,y=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0;return y-x;});render();},e=>{feed.className="empty";feed.textContent="பதிவுகளை ஏற்ற முடியவில்லை: "+e.message;});
