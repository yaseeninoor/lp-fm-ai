<!doctype html>
<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073b31"><title>NOOR Community Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:#18372d;font-family:system-ui,-apple-system,sans-serif}.head{background:#073b31;color:#fff;padding:18px 20px}.head a{color:#f1d58e;text-decoration:none}.wrap{max-width:1100px;margin:18px auto;padding:0 12px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab,.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.tab{background:#dce8df;color:#164333}.tab.active,.btn{background:#073b31;color:#fff}.layout{display:grid;grid-template-columns:280px 1fr;gap:12px}.panel{background:#fff;border:1px solid #dce7df;border-radius:15px;overflow:hidden}.side{padding:14px}.side h3{margin:5px 0 12px}.user{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf1ee;background:#fff;padding:12px 7px;color:#18372d;cursor:pointer}.user small{display:block;color:#73847b}.user.selected{background:#edf7f0}.chat{display:flex;flex-direction:column;min-height:72vh}.chathead{padding:14px 16px;border-bottom:1px solid #e5ece7;font-weight:800}.messages{padding:15px;flex:1;overflow:auto;min-height:300px;max-height:60vh;background:#f8fbf8}.bubble{max-width:82%;padding:10px 12px;border-radius:13px;margin:8px 0;background:#e5eee8;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:#d8eadc}.meta{font-size:10px;color:#6b7d72;margin-bottom:4px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #e5ece7}.composer input{flex:1;min-width:0;border:1px solid #cbd9cf;border-radius:10px;padding:12px;font-size:15px}.composer button{min-width:72px}.notice{padding:12px;color:#61736a;font-size:13px}.hidden{display:none!important}.mod{margin:8px 0;padding:9px;background:#fff2df;border-radius:9px;font-size:12px}.danger{background:#a33636}.search{width:100%;padding:10px;border:1px solid #cad8ce;border-radius:9px}.status{font-size:12px;color:#9a3a32;padding:0 14px 10px}
@media(max-width:700px){.layout{grid-template-columns:1fr}.side{max-height:220px;overflow:auto}.chat{min-height:65vh}.messages{max-height:48vh}.head{padding:15px}}
</style></head><body>
<header class="head"><b>☾ YASEENIS · NOOR PORTAL</b><div style="margin-top:6px"><a href="account.html">← எனது கணக்கு</a>　·　Community & Personal Chat</div></header>
<main class="wrap"><div class="tabs"><button class="tab active" id="communityTab">🌐 Community</button><button class="tab" id="personalTab">🔒 Personal Chat</button></div>
<div class="layout"><aside class="panel side" id="side"><h3 id="sideTitle">Community</h3><div id="sideContent" class="notice">அனைத்து பயனர்களும் இங்கே உரையாடலாம்.</div></aside>
<section class="panel chat"><div class="chathead" id="chatTitle">NOOR Community</div><div class="messages" id="messages"><div class="notice">செய்திகள் ஏற்றப்படுகின்றன…</div></div><div class="status" id="status"></div><form class="composer" id="sendForm"><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="உங்கள் செய்தியை எழுதுங்கள்…" required><button class="btn">அனுப்பு</button></form></section></div></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyBDzbv1fTRpXfmj3Nz4svl7ALWWARBuY0o",authDomain:"lp-store-23212.firebaseapp.com",projectId:"lp-store-23212",storageBucket:"lp-store-23212.firebasestorage.app",messagingSenderId:"200245726085",appId:"1:200245726085:web:846b39a873c06a1ebc12ec"};if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);let me=null,profile=null,mode="community",activeUid=null,activeConv=null,unsubscribe=null,usersCache=[];
function showStatus(t){$("status").textContent=t||""}function stopListen(){if(unsubscribe){unsubscribe();unsubscribe=null}}
function safe(t){return String(t||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function drawMessages(docs){const box=$("messages");box.innerHTML="";docs.forEach(doc=>{const m=doc.data(),mine=m.uid===me.uid,el=document.createElement("div");el.className="bubble"+(mine?" mine":"");const tm=m.createdAt&&m.createdAt.toDate?m.createdAt.toDate().toLocaleString():"இப்போது";el.innerHTML='<div class="meta">'+safe(m.name||"User")+' · '+safe(tm)+'</div><div>'+safe(m.text)+'</div>'+(profile&&["admin","superadmin"].includes(profile.role)?'<button class="btn danger" style="padding:5px 8px;font-size:10px;margin-top:7px" data-delete="'+doc.id+'">நீக்கு</button>':"");box.appendChild(el)});box.scrollTop=box.scrollHeight;box.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteMessage(b.dataset.delete))}
async function deleteMessage(id){if(!confirm("இந்த செய்தியை நீக்கவா?"))return;try{const col=mode==="community"?db.collection("communityMessages"):db.collection("conversations").doc(activeConv).collection("messages");await col.doc(id).delete();showStatus("செய்தி நீக்கப்பட்டது.")}catch(e){showStatus("நீக்க முடியவில்லை: "+e.message)}}
function listenCommunity(){stopListen();$("chatTitle").textContent="🌐 NOOR Community";$("messageInput").placeholder="அனைவருக்கும் செய்தி எழுதுங்கள்…";unsubscribe=db.collection("communityMessages").orderBy("createdAt","asc").limitToLast(150).onSnapshot(s=>drawMessages(s.docs),e=>showStatus("செய்திகளைப் படிக்க முடியவில்லை: "+e.message))}
function convId(a,b){return [a,b].sort().join("_")}
async function openPersonal(uid){activeUid=uid;activeConv=convId(me.uid,uid);const target=usersCache.find(x=>x.id===uid);$("chatTitle").textContent="🔒 "+(target?target.name:"Personal Chat");$("messageInput").placeholder="தனிப்பட்ட செய்தி…";try{const ref=db.collection("conversations").doc(activeConv),snap=await ref.get();if(!snap.exists)await ref.set({participants:[me.uid,uid],createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});stopListen();unsubscribe=ref.collection("messages").orderBy("createdAt","asc").limitToLast(150).onSnapshot(s=>drawMessages(s.docs),e=>showStatus("Personal Chat பிழை: "+e.message));}catch(e){showStatus("Chat திறக்க முடியவில்லை: "+e.message)}}
function setMode(next){mode=next;stopListen();$("communityTab").classList.toggle("active",mode==="community");$("personalTab").classList.toggle("active",mode==="personal");$("sideTitle").textContent=mode==="community"?"Community":"பயனர்கள்";$("sideContent").innerHTML="";if(mode==="community"){ $("sideContent").innerHTML='<div class="notice">அனைத்து பதிவு செய்த பயனர்களும் இங்கே செய்தி அனுப்பலாம். Admin / Super Admin தேவையற்ற செய்திகளை நீக்கவும் பயனர்களை Block செய்யவும் முடியும்.</div>'+(profile&&["admin","superadmin"].includes(profile.role)?'<div id="moderation"></div>':"");listenCommunity();if(profile&&["admin","superadmin"].includes(profile.role))loadBlocks()}else{const input=document.createElement("input");input.className="search";input.placeholder="பெயரைத் தேடுங்கள்…";$("sideContent").appendChild(input);const list=document.createElement("div");$("sideContent").appendChild(list);function render(q=""){list.innerHTML="";usersCache.filter(u=>u.id!==me.uid&&u.name.toLowerCase().includes(q.toLowerCase())).forEach(u=>{const b=document.createElement("button");b.className="user"+(activeUid===u.id?" selected":"");b.innerHTML=safe(u.name)+'<small>Personal message அனுப்ப</small>';b.onclick=()=>openPersonal(u.id);list.appendChild(b)})}input.oninput=()=>render(input.value);render();$("messages").innerHTML='<div class="notice">தனிப்பட்ட உரையாடலைத் தொடங்க ஒரு பயனரைத் தேர்வு செய்யுங்கள்.</div>';$("chatTitle").textContent="🔒 Personal Chat";}}
async function loadBlocks(){const el=document.getElementById("moderation");if(!el)return;try{const s=await db.collection("chatBlocks").get();el.innerHTML='<h3>Blocked Users</h3>';s.forEach(d=>{const row=document.createElement("div");row.className="mod";row.textContent=(d.data().name||d.id)+" ";const b=document.createElement("button");b.className="btn";b.textContent="Unblock";b.onclick=async()=>{await d.ref.delete();loadBlocks()};row.appendChild(b);el.appendChild(row)})}catch(e){showStatus("Block பட்டியலைப் படிக்க முடியவில்லை: "+e.message)}}
async function toggleBlock(uid,name){try{const ref=db.collection("chatBlocks").doc(uid),s=await ref.get();if(s.exists){await ref.delete();showStatus(name+" unblock செய்யப்பட்டார்.")}else{if(!confirm(name+"-ஐ Community மற்றும் Personal Chat-ல் Block செய்யவா?"))return;await ref.set({uid,name,blockedBy:me.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showStatus(name+" block செய்யப்பட்டார்.")}loadBlocks()}catch(e){showStatus("Block செய்ய முடியவில்லை: "+e.message)}}
async function loadUsers(){const s=await db.collection("chatProfiles").orderBy("name").limit(300).get();usersCache=s.docs.map(d=>({id:d.id,name:d.data().name||"User"}));}
$("communityTab").onclick=()=>setMode("community");$("personalTab").onclick=()=>setMode("personal");
$("sendForm").onsubmit=async e=>{e.preventDefault();const text=$("messageInput").value.trim();if(!text)return;try{const block=await db.collection("chatBlocks").doc(me.uid).get();if(block.exists){showStatus("உங்கள் Chat அனுமதி தற்காலிகமாக நிறுத்தப்பட்டுள்ளது. Admin-ஐ தொடர்புகொள்ளுங்கள்.");return}const payload={uid:me.uid,name:profile.name||me.displayName||"User",text,createdAt:firebase.firestore.FieldValue.serverTimestamp()};if(mode==="community")await db.collection("communityMessages").add(payload);else{if(!activeConv)throw new Error("முதலில் ஒரு பயனரைத் தேர்வு செய்யுங்கள்.");const ref=db.collection("conversations").doc(activeConv);await ref.collection("messages").add(payload);await ref.update({updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}$("messageInput").value="";showStatus("")}catch(e){showStatus("செய்தி அனுப்ப முடியவில்லை: "+e.message)}};
auth.onAuthStateChanged(async u=>{if(!u){location.replace("login.html");return}me=u;try{const s=await db.collection("users").doc(u.uid).get(),p=s.exists?s.data():{};profile={name:p.fullName||u.displayName||"User",role:p.role||"user"};await db.collection("chatProfiles").doc(u.uid).set({name:profile.name,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await loadUsers();setMode("community")}catch(e){showStatus("Chat அமைப்பை ஏற்ற முடியவில்லை. Firebase Rules deploy செய்யப்பட்டுள்ளதா பார்க்கவும்: "+e.message)}});
</script></body></html>
