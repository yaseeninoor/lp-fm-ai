<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><title>My Profile | Yaseenis Noor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f4;color:#111;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{height:64px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 17px;border-bottom:1px solid #e6e9e7;position:sticky;top:0}.top a{font-size:25px;color:#111;text-decoration:none}.top b{font-size:18px}.wrap{max-width:620px;margin:20px auto;padding:0 14px 35px}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px #102d2008}.hero{text-align:center;padding:26px 20px}.photo{width:108px;height:108px;border-radius:50%;background:#e1eee7;color:#075e54;display:grid;place-items:center;font-size:36px;font-weight:800;margin:0 auto 12px;overflow:hidden;border:3px solid #d9eee6}.photo img{width:100%;height:100%;object-fit:cover}.change{display:inline-block;margin:5px 0 0;color:#087b61;font-size:13px;font-weight:700;cursor:pointer}.name{font-size:21px;font-weight:800}.handle{font-size:13px;color:#6c7771;margin-top:5px}.verified{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#168cf0;color:white;font-size:11px;vertical-align:middle;margin-left:5px}.label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,textarea{width:100%;border:1px solid #dce3df;border-radius:11px;padding:12px;font:inherit;font-size:15px;background:#fff}input{height:47px}textarea{min-height:85px;resize:vertical}.hint{font-size:11px;color:#78837d;line-height:1.6;margin-top:7px}.btn{width:100%;border:0;border-radius:12px;background:#075e54;color:#fff;padding:14px;font-weight:800;font-size:15px;margin-top:18px}.secondary{display:block;text-align:center;color:#075e54;text-decoration:none;font-weight:700;margin-top:15px}.msg{font-size:12px;line-height:1.6;margin-top:12px;color:#246448;overflow-wrap:anywhere}
</style></head><body>
<header class="top"><a href="chat.html">‹</a><b>Profile</b></header>
<main class="wrap">
<section class="card hero"><div class="photo" id="photoPreview">N</div><label class="change" for="photoFile">Edit profile photo</label><input id="photoFile" type="file" accept="image/*" hidden><div class="name" id="displayName">Your name</div><div class="handle" id="displayHandle">@username</div></section>
<section class="card"><form id="form"><label class="label" for="name">Name</label><input id="name" maxlength="80" required><label class="label" for="about">About</label><textarea id="about" maxlength="140" placeholder="Hey there! I am using NOOR Chat."></textarea><div class="hint">This information is visible to signed-in NOOR Chat members.</div><label class="label" for="phone">Phone number</label><input id="phone" type="tel" maxlength="20" required><label class="label" for="username">Username</label><input id="username" maxlength="20" placeholder="3–20 letters, numbers or underscore"><div class="hint">Your unique @username is used by other members to find you. If you change it, the new username must be available.</div><label class="label" for="email">Email</label><input id="email" disabled><button class="btn" id="saveBtn">Save profile</button></form><div class="msg" id="msg"></div><a class="secondary" href="chat.html">Back to Chats</a></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyBDzbv1fTRpXfmj3Nz4svl7ALWWARBuY0o",authDomain:"lp-store-23212.firebaseapp.com",projectId:"lp-store-23212",storageBucket:"lp-store-23212.firebasestorage.app",messagingSenderId:"200245726085",appId:"1:200245726085:web:846b39a873c06a1ebc12ec"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.firestore(),storage=firebase.storage(),$=id=>document.getElementById(id);let user=null,oldHandle="",avatarUrl="";
function initials(v){return String(v||"N").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()}
function normalize(v){return String(v||"").trim().toLowerCase().replace(/^@/,"")}
async function saveUsername(handle,name){
 if(!handle)return oldHandle;
 if(!/^[a-z0-9_]{3,20}$/.test(handle))throw new Error("Username must contain 3–20 letters, numbers or underscores.");
 const ref=db.collection("usernames").doc(handle);
 await db.runTransaction(async tx=>{const taken=await tx.get(ref);if(taken.exists&&taken.data().uid!==user.uid)throw new Error("This username is already taken.");if(oldHandle&&oldHandle!==handle)tx.delete(db.collection("usernames").doc(oldHandle));if(!taken.exists)tx.set(ref,{uid:user.uid,username:handle,createdAt:firebase.firestore.FieldValue.serverTimestamp()});});
 return handle;
}
function showPhoto(url){$("photoPreview").innerHTML=url?'<img src="'+url+'" alt="Profile photo">':initials($("name").value||user.displayName)}
auth.onAuthStateChanged(async u=>{if(!u){location.replace("login.html");return}user=u;try{const [us,cs]=await Promise.all([db.collection("users").doc(u.uid).get(),db.collection("chatProfiles").doc(u.uid).get()]);const a=us.exists?us.data():{},p=cs.exists?cs.data():{};$("name").value=a.fullName||u.displayName||"";$("phone").value=a.phone||"";$("email").value=u.email||"";$("about").value=p.about||"";oldHandle=p.username||"";$("username").value=oldHandle;avatarUrl=p.avatarUrl||"";$("displayName").textContent=a.fullName||u.displayName||"Member";$("displayHandle").textContent=oldHandle?"@"+oldHandle:"Choose a username";showPhoto(avatarUrl)}catch(e){$("msg").textContent="Profile could not load: "+e.message}});
$("name").oninput=()=>{if(!avatarUrl)showPhoto("")};
$("photoFile").onchange=async()=>{const f=$("photoFile").files[0];if(!f)return;if(!f.type.startsWith("image/")){ $("msg").textContent="Please choose an image.";return}if(f.size>5*1024*1024){$("msg").textContent="Profile photo must be under 5 MB.";return}try{$("msg").textContent="Uploading photo…";const ref=storage.ref("noor-chat-media/"+user.uid+"/profile_"+Date.now()+"_"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_"));const snap=await ref.put(f);avatarUrl=await snap.ref.getDownloadURL();showPhoto(avatarUrl);$("msg").textContent="Photo uploaded. Press Save profile to finish."}catch(e){$("msg").textContent="Photo upload failed: "+e.message}};
$("form").onsubmit=async e=>{e.preventDefault();const fullName=$("name").value.trim(),phone=$("phone").value.trim(),about=$("about").value.trim(),handle=normalize($("username").value);if(fullName.length<2||!/^[+0-9() -]{7,20}$/.test(phone)||!handle){ $("msg").textContent="Enter a valid name, phone number and username.";return}const btn=$("saveBtn");btn.disabled=true;btn.textContent="Saving…";try{const nextHandle=await saveUsername(handle,fullName);await user.updateProfile({displayName:fullName});await db.collection("users").doc(user.uid).set({uid:user.uid,fullName,phone,email:user.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await db.collection("chatProfiles").doc(user.uid).set({name:fullName,username:nextHandle,about,avatarUrl,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});oldHandle=nextHandle;$("displayName").textContent=fullName;$("displayHandle").textContent=nextHandle?"@"+nextHandle:"No username";$("msg").textContent="Profile saved successfully."}catch(e){$("msg").textContent="Could not save profile: "+e.message}finally{btn.disabled=false;btn.textContent="Save profile"}};
</script></body></html>
