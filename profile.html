<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073b31"><title>My Profile | Yaseeni Noor</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f2;color:#17342a;font-family:system-ui,sans-serif}.head{background:#073b31;color:white;padding:22px}.wrap{max-width:560px;margin:25px auto;padding:0 15px}.panel{background:white;border-radius:16px;padding:22px;box-shadow:0 8px 25px #1232}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;height:46px;border:1px solid #cbd8cf;border-radius:9px;padding:0 12px;font-size:15px}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#073b31;color:white;font-weight:800;margin-top:18px}.msg{font-size:13px;color:#246448;margin-top:12px}</style></head><body><header class="head"><b>YASEENIS · NOOR PORTAL</b><h2>Profile அமைப்புகள்</h2></header><main class="wrap"><section class="panel"><form id="form"><label for="name">முழுப் பெயர்</label><input id="name" required maxlength="80"><label for="phone">மொபைல் எண்</label><input id="phone" type="tel" required maxlength="20"><label>Email</label><input id="email" disabled><button class="btn">மாற்றங்களைச் சேமிக்கவும்</button></form><div class="msg" id="msg"></div><a href="account.html">← எனது கணக்கு</a></section></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>const c={apiKey:"AIzaSyBDzbv1fTRpXfmj3Nz4svl7ALWWARBuY0o",authDomain:"lp-store-23212.firebaseapp.com",projectId:"lp-store-23212",storageBucket:"lp-store-23212.firebasestorage.app",messagingSenderId:"200245726085",appId:"1:200245726085:web:846b39a873c06a1ebc12ec"};if(!firebase.apps.length)firebase.initializeApp(c);const auth=firebase.auth(),db=firebase.firestore();let current;auth.onAuthStateChanged(async u=>{if(!u){location.replace("login.html");return}current=u;const s=await db.collection("users").doc(u.uid).get(),p=s.exists?s.data():{};document.getElementById("name").value=p.fullName||u.displayName||"";document.getElementById("phone").value=p.phone||"";document.getElementById("email").value=u.email||""});document.getElementById("form").onsubmit=async e=>{e.preventDefault();const fullName=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim();if(fullName.length<2||!/^\+?[0-9()\-\s]{7,20}$/.test(phone)){document.getElementById("msg").textContent="பெயர் மற்றும் சரியான மொபைல் எண்ணை உள்ளிடுங்கள்.";return}try{await current.updateProfile({displayName:fullName});await db.collection("users").doc(current.uid).set({uid:current.uid,fullName,phone,email:current.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await db.collection("chatProfiles").doc(current.uid).set({name:fullName,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});document.getElementById("msg").textContent="Profile வெற்றிகரமாகப் புதுப்பிக்கப்பட்டது."}catch(e){document.getElementById("msg").textContent="புதுப்பிக்க முடியவில்லை: "+e.message}};</script></body></html>
