ompat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script><script>const c={apiKey:"AIzaSyBDzbv1fTRpXfmj3Nz4svl7ALWWARBuY0o",authDomain:"lp-store-23212.firebaseapp.com",projectId:"lp-store-23212",storageBucket:"lp-store-23212.firebasestorage.app",messagingSenderId:"200245726085",appId:"1:200245726085:web:846b39a873c06a1ebc12ec"};if(!firebase.apps.length)firebase.initializeApp(c);const auth=firebase.auth(),db=firebase.firestore(),fn=firebase.app().functions("us-central1");let currentRole="user";auth.onAuthStateChanged(async u=>{if(!u){location.replace("../login.html");return}try{const t=await u.getIdTokenResult(true);currentRole=t.claims.role||(t.claims.superadmin?"superadmin":t.claims.admin?"admin":"user");if(!["admin","superadmin"].includes(currentRole)){await auth.signOut();location.replace("../login.html");return}await loadUsers()}catch(e){document.getElementById("status").textContent="அனுமதி சரிபார்ப்பு தோல்வி: "+e.message}});async function loadUsers(){try{const s=await db.collection("users").orderBy("createdAt","desc").limit(200).get();document.getElementById("status").textContent=s.size+" பயனர் கணக்குகள் (அதிகபட்சம் 200)";document.getElementById("rows").innerHTML=s.docs.map(d=>{const p=d.data(),role=p.role||"user";const controls=currentRole==="superadmin"&&d.id!==auth.currentUser.uid?'<select class="role" id="role-'+esc(d.id)+'"><option value="user" '+(role==="user"?"selected":"")+'>User</option><option value="admin" '+(role==="admin"?"selected":"")+'>Admin</option><option value="superadmin" '+(role==="superadmin"?"selected":"")+'>Super Admin</option></select> <button class="btn apply" onclick="changeRole(\''+esc(d.id)+'\')">Save</button>':(currentRole==="superadmin"?"—":"Super Admin மட்டும்");return '<tr><td>'+esc(p.fullName||"—")+'</td><td>'+esc(p.email||"—")+'</td><td>'+esc(p.phone||"—")+'</td><td>'+esc(role)+'</td><td>'+controls+'</td></tr>'}).join("")}catch(e){document.getElementById("status").textContent="பயனர் பட்டியலை ஏற்ற முடியவில்லை: "+e.message}}async function changeRole(uid){const role=document.getElementById("role-"+uid)?.value;if(!role)return;try{const call=fn.httpsCallable("setNoorUserRole");const r=await call({uid,role});document.getElementById("message").textContent=r.data.message+" User மீண்டும் உள்நுழைந்ததும் மாற்றம் அமலும்.";await loadUsers()}catch(e){document.getElementById("message").textContent="Role மாற்றம் தோல்வி: "+(e.message||e)}}function esc(v){return String(v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</script></body></html>
