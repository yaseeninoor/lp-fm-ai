<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NOOR Channel Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:#17342a;font-family:system-ui,sans-serif}.head{background:#075e54;color:#fff;padding:20px}.wrap{max-width:760px;margin:22px auto;padding:0 14px}.panel{background:white;border-radius:15px;padding:20px;box-shadow:0 5px 20px #1232}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd8cf;border-radius:9px;font:15px system-ui}textarea{min-height:130px;resize:vertical}.btn{padding:12px 16px;border:0;border-radius:9px;background:#075e54;color:#fff;font-weight:800;margin:12px 6px 0 0;cursor:pointer}.muted{font-size:12px;color:#64796d}.status{font-size:13px;margin-top:12px;color:#155b43}</style></head><body><header class="head"><b>YASEENIS · ADMIN</b><h2>📢 NOOR Channel Post</h2><a href="index.html" style="color:#e4f5e8">← Admin Studio</a>　<a href="../channel.html" style="color:#e4f5e8">View Channel</a></header><main class="wrap"><section class="panel"><p>இங்கே வெளியிடும் பதிவுகள் NOOR Channel-ல் அனைத்து பார்வையாளர்களுக்கும் தெரியும். Admin / Super Admin மட்டுமே வெளியிட முடியும்.</p><form id="form"><label>Category</label><select id="category"><option>அறிவிப்பு</option><option>அமுத மொழிகள்</option><option>ஹதீஸ்</option><option>பயான் / Audio</option><option>Video</option><option>Books & PDF</option><option>Articles</option><option>Events</option><option>மற்றவை</option></select><label>தலைப்பு</label><input id="title" maxlength="160" required placeholder="பதிவின் தலைப்பு"><label>விவரம்</label><textarea id="body" maxlength="10000" placeholder="பதிவின் விவரத்தை எழுதுங்கள்"></textarea><label>படம் / PDF / Audio / Video / Document</label><input id="file" type="file" accept="image/*,audio/*,video/*,application/pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt"><p class="muted">அதிகபட்சம் 200 MB. கோப்பு Firebase Storage-ல் சேமிக்கப்படும்.</p><button class="btn" id="publish">📢 Publish to Channel</button></form><div id="status" class="status"></div></section></main>

const c={apiKey:"AIzaSyBDzbv1fTRpXfmj3Nz4svl7ALWWARBuY0o",authDomain:"lp-store-23212.firebaseapp.com",projectId:"lp-store-23212",storageBucket:"lp-store-23212.firebasestorage.app",messagingSenderId:"200245726085",appId:"1:200245726085:web:846b39a873c06a1ebc12ec"};if(!firebase.apps.length)firebase.initializeApp(c);const auth=firebase.auth(),db=firebase.firestore(),storage=firebase.storage();let current=null,allowed=false;auth.onAuthStateChanged(async u=>{if(!u){location.replace("../login.html");return}current=u;try{const t=await u.getIdTokenResult(true);allowed=t.claims.role==="admin"||t.claims.role==="superadmin"||t.claims.admin===true||t.claims.superadmin===true;if(!allowed){await auth.signOut();location.replace("../login.html")}}catch(e){document.getElementById("status").textContent=e.message}});
document.getElementById("form").onsubmit=async e=>{e.preventDefault();if(!current||!allowed)return;const b=document.getElementById("publish"),status=document.getElementById("status"),file=document.getElementById("file").files[0];b.disabled=true;status.textContent="பதிவு வெளியிடப்படுகிறது…";try{let fileUrl="",fileName="",contentType="";if(file){if(file.size>200*1024*1024)throw new Error("200 MB-க்கு குறைவான கோப்பைத் தேர்வு செய்யுங்கள்.");fileName=file.name;contentType=file.type||"application/octet-stream";const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const ref=storage.ref("noor-portal-media/"+current.uid+"/channel/"+Date.now()+"_"+safeName);const task=ref.put(file,{contentType});await new Promise((resolve,reject)=>task.on("state_changed",s=>status.textContent="Upload: "+Math.round(s.bytesTransferred/s.totalBytes*100)+"%",reject,resolve));fileUrl=await ref.getDownloadURL()}await db.collection("channelPosts").add({title:document.getElementById("title").value.trim(),body:document.getElementById("body").value.trim(),category:document.getElementById("category").value,author:current.displayName||current.email||"NOOR Admin",createdBy:current.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp(),published:true,fileUrl,fileName,contentType});status.textContent="வெற்றிகரமாக NOOR Channel-ல் வெளியிடப்பட்டது.";e.target.reset()}catch(err){status.textContent="வெளியிட முடியவில்லை: "+err.message}finally{b.disabled=false}};
</script></body></html>
