<!doctype html>
<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#075e54"><title>NOOR Chat Management</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f0;color:#17342a;font-family:system-ui,sans-serif}.head{background:#073b31;color:#fff;padding:18px 22px}.head a{color:#f2d98e;text-decoration:none;margin-right:15px}.wrap{max-width:1250px;margin:20px auto;padding:0 14px}.grid{display:grid;grid-template-columns:300px 1fr;gap:14px}.panel{background:#fff;border:1px solid #dce8df;border-radius:15px;overflow:hidden}.panel h3{margin:0;padding:15px;border-bottom:1px solid #e7eee9}.tabs{display:flex;gap:7px;padding:12px}.tab,.btn{border:0;border-radius:9px;padding:10px 13px;background:#e8f1eb;color:#174a38;font-weight:700;cursor:pointer}.tab.active,.btn.primary{background:#075e54;color:#fff}.list{max-height:72vh;overflow:auto}.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf1ee;background:#fff;padding:12px;cursor:pointer}.item:hover,.item.active{background:#edf7f0}.item b{display:block;font-size:13px}.item small{display:block;color:#708078;font-size:11px;margin-top:4px}.messages{padding:15px;max-height:65vh;overflow:auto;background:#f5f7f4;min-height:380px}.msg{max-width:80%;background:#fff;border-radius:10px;padding:10px;margin:8px 0;box-shadow:0 1px 2px #0001;overflow-wrap:anywhere;font-size:13px}.msg.mine{margin-left:auto;background:#ddf2df}.meta{font-size:10px;color:#738178;margin-bottom:5px}.actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.danger{background:#fff0ef;color:#a32e2e}.status{padding:10px 14px;color:#8b4d2d;font-size:12px;min-height:20px}.empty{padding:25px;text-align:center;color:#78877f;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.list{max-height:250px}.messages{min-height:300px}.head{padding:15px}}
</style></head><body>
<header class="head"><b>YASEENIS · NOOR CHAT ADMIN</b><h2 style="margin:7px 0">Chat Management</h2><a href="index.html">← Admin Studio</a><a href="../chat.html">Open Chat</a><a href="users.html">Manage Users</a></header>
<main class="wrap"><div class="grid">
<section class="panel"><h3>உரையாடல்கள்</h3><div class="tabs"><button class="tab active" id="groupTab">Community</button><button class="tab" id="privateTab">Personal</button></div><div class="list" id="list"><div class="empty">Loading…</div></div></section>
<section class="panel"><h3 id="title">NOOR Community</h3><div class="status" id="status"></div><div class="messages" id="messages"><div class="empty">Select a conversation.</div></div></section>
</div></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyBDzbv1fTRpXfmj3Nz4svl7ALWWARBuY0o",authDomain:"lp-store-23212.firebaseapp.com",projectId:"lp-store-23212",storageBucket:"lp-store-23212.firebasestorage.app",messagingSenderId:"200245726085",appId:"1:200245726085:web:846b39a873c06a1ebc12ec"};if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);let me=null,kind="community",activeId=null,stop=null,convs=[];
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function say(t){$("status").textContent=t||""}
function stopFeed(){if(stop){stop();stop=null}}
function adminRole(t){return t.claims.role||(t.claims.superadmin?"superadmin":t.claims.admin?"admin":"user")}
async function loadCommunity(){kind="community";activeId="community";stopFeed();$("groupTab").classList.add("active");$("privateTab").classList.remove("active");$("title").textContent="NOOR Community";$("list").innerHTML='<button class="item active"><b>🌐 NOOR Community</b><small>Group messages</small></button>';say("");stop=db.collection("communityMessages").orderBy("createdAt","desc").limit(150).onSnapshot(s=>draw(s.docs,true),e=>say("Community load error: "+e.message))}
async function loadConversations(){kind="personal";activeId=null;stopFeed();$("groupTab").classList.remove("active");$("privateTab").classList.add("active");$("title").textContent="Personal Conversations";$("messages").innerHTML='<div class="empty">Select a private conversation.</div>';say("");try{const s=await db.collection("conversations").orderBy("updatedAt","desc").limit(200).get();convs=s.docs.map(d=>({id:d.id,...d.data()}));$("list").innerHTML="";convs.forEach(c=>{const b=document.createElement("button");b.className="item";b.innerHTML='<b>🔒 '+esc((c.participants||[]).join(" ↔ "))+'</b><small>'+esc(c.id)+'</small>';b.onclick=()=>openConversation(c);$("list").appendChild(b)});if(!convs.length)$("list").innerHTML='<div class="empty">No personal conversations.</div>'}catch(e){say("Conversation list error: "+e.message)}}
function draw(docs,community){const box=$("messages");box.innerHTML="";if(!docs.length){box.innerHTML='<div class="empty">No messages yet.</div>';return}docs.slice().reverse().forEach(d=>{const m=d.data(),el=document.createElement("div");el.className="msg";const date=m.createdAt&&m.createdAt.toDate?m.createdAt.toDate().toLocaleString():"";el.innerHTML='<div class="meta">'+esc(m.name||m.uid||"Member")+' · '+esc(date)+'</div>'+(m.text?'<div>'+esc(m.text)+'</div>':"")+(m.attachmentUrl?'<p><a target="_blank" rel="noopener" href="'+esc(m.attachmentUrl)+'">📎 '+esc(m.attachmentName||"Attachment")+'</a></p>':"");const actions=document.createElement("div");actions.className="actions";const del=document.createElement("button");del.className="btn danger";del.textContent="Delete message";del.onclick=()=>removeMessage(d.id,community);actions.appendChild(del);if(m.uid){const block=document.createElement("button");block.className="btn";block.textContent="Block / Unblock member";block.onclick=()=>toggleBlock(m.uid,m.name||"Member");actions.appendChild(block)}el.appendChild(actions);box.appendChild(el)});box.scrollTop=box.scrollHeight}
function openConversation(c){kind="personal";activeId=c.id;stopFeed();$("title").textContent="Personal: "+c.id;$("list").querySelectorAll(".item").forEach(x=>x.classList.remove("active"));stop=db.collection("conversations").doc(c.id).collection("messages").orderBy("createdAt","desc").limit(150).onSnapshot(s=>draw(s.docs,false),e=>say("Private message error: "+e.message))}
async function removeMessage(id,community){if(!confirm("இந்தச் செய்தியை நிரந்தரமாக நீக்கவா?"))return;try{const ref=community?db.collection("communityMessages").doc(id):db.collection("conversations").doc(activeId).collection("messages").doc(id);await ref.delete();say("Message deleted.")}catch(e){say("Delete failed: "+e.message)}}
async function toggleBlock(uid,name){try{const ref=db.collection("chatBlocks").doc(uid),s=await ref.get();if(s.exists){await ref.delete();say(name+" unblocked.")}else{if(!confirm(name+"-ஐ Chat-ல் Block செய்யவா?"))return;await ref.set({uid,name,blockedBy:me.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});say(name+" blocked.")}}catch(e){say("Block action failed: "+e.message)}}
$("groupTab").onclick=loadCommunity;$("privateTab").onclick=loadConversations;
auth.onAuthStateChanged(async u=>{if(!u){location.replace("../login.html");return}me=u;try{const t=await u.getIdTokenResult(true);if(!["admin","superadmin"].includes(adminRole(t))){location.replace("../login.html");return}loadCommunity()}catch(e){say("Access denied: "+e.message)}});
</script></body></html>
