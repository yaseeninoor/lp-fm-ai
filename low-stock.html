<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LP-FM Low Stock Alert</title>

<meta name="theme-color" content="#061322">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #04101f,
            #0a1b31,
            #061322
        );

    color:#ffffff;
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{

    position:sticky;
    top:0;
    z-index:50;

    padding:14px 18px;

    background:#061322f5;

    border-bottom:
        1px solid #ffffff15;

    display:flex;

    justify-content:
        space-between;

    align-items:center;

    gap:15px;
}


.brand{

    display:flex;

    align-items:center;

    gap:12px;
}


.logo{

    width:46px;
    height:46px;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #2188ff,
            #0757c8
        );

    display:grid;

    place-items:center;

    font-weight:900;

    font-size:16px;
}


.brand h2{

    margin:0;

    font-size:18px;
}


.brand small{

    color:#7890a9;

    font-size:10px;
}


.user-area{

    display:flex;

    align-items:center;

    gap:10px;
}


.user-email{

    color:#9fcaff;

    font-size:11px;
}


button{

    border:0;

    border-radius:9px;

    padding:11px 15px;

    color:#ffffff;

    background:#1677ff;

    font-weight:700;

    cursor:pointer;

    font-size:12px;
}


button:hover{

    opacity:.9;
}


button.secondary{

    background:#17314f;
}


/* =========================
   MAIN
========================= */

.main{

    max-width:1400px;

    margin:auto;

    padding:
        25px 16px 60px;
}


.top{

    display:flex;

    justify-content:
        space-between;

    align-items:flex-end;

    gap:15px;

    margin-bottom:20px;
}


.top h1{

    margin:0;

    font-size:28px;
}


.top p{

    margin:
        7px 0 0;

    color:#8fa5bc;

    font-size:12px;
}


/* =========================
   STATS
========================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;

    margin-bottom:20px;
}


.stat{

    padding:20px;

    border-radius:15px;

    background:#ffffff06;

    border:
        1px solid #ffffff12;
}


.stat span{

    color:#7890a9;

    font-size:10px;

    font-weight:700;
}


.stat strong{

    display:block;

    font-size:32px;

    margin-top:8px;
}


.zero-stat strong{

    color:#ff7b7b;
}


.low-stat strong{

    color:#ffc15c;
}


.total-stat strong{

    color:#70aaff;
}


/* =========================
   PANEL
========================= */

.panel{

    background:#071426dd;

    border:
        1px solid #ffffff12;

    border-radius:16px;

    padding:18px;
}


.toolbar{

    display:flex;

    gap:10px;

    margin-bottom:15px;

    flex-wrap:wrap;
}


input,
select{

    background:#0b2038;

    color:#ffffff;

    border:
        1px solid #ffffff18;

    border-radius:9px;

    padding:11px;

    outline:none;

    font-size:12px;
}


input::placeholder{

    color:#617990;
}


.search{

    flex:1;

    min-width:220px;
}


/* =========================
   ALERT MESSAGE
========================= */

.alert-box{

    display:none;

    margin-bottom:15px;

    padding:12px;

    border-radius:10px;

    background:#ef444422;

    color:#ff9b9b;

    font-size:11px;

    border:
        1px solid #ef444433;
}


/* =========================
   TABLE
========================= */

.table-wrap{

    overflow:auto;

    width:100%;
}


table{

    width:100%;

    min-width:950px;

    border-collapse:
        collapse;
}


th,
td{

    padding:12px 9px;

    border-bottom:
        1px solid #ffffff0d;

    text-align:left;

    font-size:11px;
}


th{

    color:#86a0ba;

    font-size:10px;

    white-space:nowrap;
}


td{

    color:#dce7f2;
}


.badge{

    display:inline-block;

    padding:
        5px 9px;

    border-radius:20px;

    font-size:9px;

    font-weight:800;

    white-space:nowrap;
}


.badge.zero{

    color:#ff8d8d;

    background:#ef444422;
}


.badge.low{

    color:#ffc15c;

    background:#f59e0b22;
}


.required{

    color:#ff9b9b;

    font-weight:800;
}


/* =========================
   EMPTY
========================= */

.empty{

    text-align:center;

    padding:45px;

    color:#7890a9;

    font-size:12px;
}


/* =========================
   LOGIN
========================= */

#loginModal{

    position:fixed;

    inset:0;

    z-index:200;

    background:
        rgba(0,0,0,.88);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;
}


.login-box{

    width:
        min(400px,100%);

    background:#0a1b31;

    border:
        1px solid #ffffff18;

    border-radius:18px;

    padding:25px;

    box-shadow:
        0 20px 70px #000;
}


.login-box h2{

    margin:
        0 0 8px;
}


.login-box p{

    color:#7890a9;

    font-size:11px;

    margin-bottom:20px;
}


.form-group{

    margin-bottom:12px;
}


.form-group label{

    display:block;

    color:#8fa5bc;

    font-size:10px;

    margin-bottom:5px;
}


.form-group input{

    width:100%;
}


.login-button{

    width:100%;

    margin-top:5px;
}


/* =========================
   LOADING
========================= */

.loading{

    text-align:center;

    padding:40px;

    color:#8fa5bc;

    font-size:12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{

        align-items:flex-start;

    }

    .user-email{

        display:none;
    }

    .top{

        flex-direction:
            column;

        align-items:
            flex-start;
    }

    .top h1{

        font-size:24px;
    }

    .stats{

        grid-template-columns:
            1fr;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="brand">

        <div class="logo">
            LP
        </div>

        <div>

            <h2>
                LP-FM Inventory
            </h2>

            <small>
                Low Stock Alert • ST26
            </small>

        </div>

    </div>


    <div class="user-area">

        <span
            id="userEmail"
            class="user-email">
        </span>


        <button
            class="secondary"
            onclick="logout()">

            Logout

        </button>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">


    <section class="top">

        <div>

            <h1>
                ⚠️ Low Stock Alert
            </h1>

            <p>
                Materials requiring replenishment
            </p>

        </div>


        <button
            onclick="loadMaterials()">

            ↻ Refresh

        </button>

    </section>



    <!-- =====================
         STATISTICS
    ====================== -->

    <section class="stats">


        <div
            class="stat zero-stat">

            <span>
                ZERO STOCK
            </span>

            <strong
                id="zeroCount">

                0

            </strong>

        </div>


        <div
            class="stat low-stat">

            <span>
                LOW STOCK
            </span>

            <strong
                id="lowCount">

                0

            </strong>

        </div>


        <div
            class="stat total-stat">

            <span>
                TOTAL ALERTS
            </span>

            <strong
                id="totalCount">

                0

            </strong>

        </div>


    </section>



    <!-- =====================
         INVENTORY PANEL
    ====================== -->

    <section class="panel">


        <div class="toolbar">


            <input
                id="search"
                class="search"
                placeholder="Search material code / description..."
                oninput="render()">


            <select
                id="filter"
                onchange="render()">

                <option value="all">
                    All Alerts
                </option>

                <option value="zero">
                    Zero Stock
                </option>

                <option value="low">
                    Low Stock
                </option>

            </select>


        </div>



        <div
            id="alertBox"
            class="alert-box">
        </div>



        <div
            id="loading"
            class="loading">

            Loading inventory...

        </div>



        <div
            class="table-wrap"
            id="tableWrap"
            style="display:none;">

            <table>

                <thead>

                    <tr>

                        <th>
                            MATERIAL CODE
                        </th>

                        <th>
                            DESCRIPTION
                        </th>

                        <th>
                            STORAGE
                        </th>

                        <th>
                            UNIT
                        </th>

                        <th>
                            CURRENT STOCK
                        </th>

                        <th>
                            MINIMUM
                        </th>

                        <th>
                            REQUIRED
                        </th>

                        <th>
                            STATUS
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="rows">

                </tbody>

            </table>

        </div>

    </section>


</main>



<!-- =========================
     LOGIN
========================= -->

<div
    id="loginModal">


    <div
        class="login-box">


        <h2>
            LP-FM Login
        </h2>


        <p>
            Sign in to access material inventory.
        </p>



        <div
            class="form-group">

            <label>
                Email
            </label>

            <input
                id="loginEmail"
                type="email"
                autocomplete="email"
                placeholder="Enter your email">

        </div>



        <div
            class="form-group">

            <label>
                Password
            </label>

            <input
                id="loginPassword"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password">

        </div>



        <button
            class="login-button"
            onclick="login()">

            Login

        </button>


    </div>

</div>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">


/* Firebase App */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";



/* Firebase Authentication */

import {
    getAuth,
    onAuthStateChanged,
    signInWithEmailAndPassword,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";



/* Firestore */

import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



/* =========================
   FIREBASE CONFIG
========================= */


const firebaseConfig = {

    apiKey:
        "AIzaSyBDzbv1fTRpXfmj3Nz4svl7ALWWARBuY0o",

    authDomain:
        "lp-store-23212.firebaseapp.com",

    projectId:
        "lp-store-23212",

    storageBucket:
        "lp-store-23212.firebasestorage.app",

    messagingSenderId:
        "200245726085",

    appId:
        "1:200245726085:web:081aa1315c64e5b4bc12ec",

    measurementId:
        "G-21VPLM3N6S"

};



/* =========================
   INITIALIZE FIREBASE
========================= */


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* =========================
   GLOBAL DATA
========================= */


let materials = [];



/* =========================
   AUTH STATE
========================= */


onAuthStateChanged(

    auth,

    async user => {


        if(!user){

            document
                .getElementById(
                    "loginModal"
                )
                .style.display =
                "flex";


            document
                .getElementById(
                    "loading"
                )
                .style.display =
                "none";


            return;

        }



        document
            .getElementById(
                "loginModal"
            )
            .style.display =
            "none";



        document
            .getElementById(
                "userEmail"
            )
            .textContent =
            user.email;



        await loadMaterials();

    }

);



/* =========================
   LOGIN
========================= */


window.login =
async function(){


    const email =
        document
            .getElementById(
                "loginEmail"
            )
            .value
            .trim();



    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;



    if(!email){

        alert(
            "Please enter email."
        );

        return;

    }



    if(!password){

        alert(
            "Please enter password."
        );

        return;

    }



    try{


        await signInWithEmailAndPassword(

            auth,

            email,

            password

        );


    }
    catch(error){


        console.error(
            "Login error:",
            error
        );


        alert(

            "Login failed:\n\n" +

            error.message

        );

    }

};



/* =========================
   LOGOUT
========================= */


window.logout =
async function(){

    try{

        await signOut(auth);

    }
    catch(error){

        console.error(error);

    }

};



/* =========================
   LOAD MATERIALS
========================= */


window.loadMaterials =
async function(){


    document
        .getElementById(
            "loading"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "tableWrap"
        )
        .style.display =
        "none";



    try{


        const snapshot =
            await getDocs(

                collection(

                    db,

                    "materials"

                )

            );



        materials =

            snapshot.docs.map(

                document => ({

                    id:
                        document.id,

                    ...document.data()

                })

            )
            .filter(

                item => {

                    const stock =
                        Number(
                            item.stock || 0
                        );


                    const minimum =
                        Number(
                            item.minimum || 0
                        );


                    return (

                        stock <= 0

                        ||

                        (
                            minimum > 0

                            &&

                            stock <= minimum
                        )

                    );

                }

            );



        document
            .getElementById(
                "loading"
            )
            .style.display =
            "none";



        document
            .getElementById(
                "tableWrap"
            )
            .style.display =
            "block";



        render();



    }
    catch(error){


        console.error(
            "Firestore error:",
            error
        );


        document
            .getElementById(
                "loading"
            )
            .textContent =
            "Unable to load inventory.";


        showError(

            "Firestore Error: " +

            error.message

        );

    }

};



/* =========================
   RENDER
========================= */


window.render =
function(){


    const search =

        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();



    const filter =

        document
            .getElementById(
                "filter"
            )
            .value;



    const list =

        materials.filter(

            item => {


                const stock =

                    Number(
                        item.stock || 0
                    );



                const minimum =

                    Number(
                        item.minimum || 0
                    );



                const type =

                    stock <= 0

                    ?

                    "zero"

                    :

                    "low";



                const text =

                    (

                        String(
                            item.code || ""
                        )

                        +

                        " "

                        +

                        String(
                            item.description || ""
                        )

                        +

                        " "

                        +

                        String(
                            item.storage || ""
                        )

                    )
                    .toLowerCase();



                const searchOK =

                    !search

                    ||

                    text.includes(
                        search
                    );



                const filterOK =

                    filter === "all"

                    ||

                    filter === type;



                return (

                    searchOK

                    &&

                    filterOK

                );

            }

        );



    updateStats();



    const rows =

        document
            .getElementById(
                "rows"
            );



    if(!list.length){


        rows.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty">

                    🎉 No low-stock materials found.

                </td>

            </tr>

        `;


        return;

    }



    rows.innerHTML =

        list.map(

            item => {


                const stock =

                    Number(
                        item.stock || 0
                    );



                const minimum =

                    Number(
                        item.minimum || 0
                    );



                const isZero =

                    stock <= 0;



                const required =

                    Math.max(

                        minimum - stock,

                        0

                    );



                return `

                    <tr>


                        <td>

                            <strong>

                                ${safe(
                                    item.code
                                )}

                            </strong>

                        </td>



                        <td>

                            ${safe(
                                item.description
                            )}

                        </td>



                        <td>

                            ${safe(
                                item.storage
                            )}

                        </td>



                        <td>

                            ${safe(
                                item.unit
                            )}

                        </td>



                        <td>

                            <strong>

                                ${formatNumber(
                                    stock
                                )}

                            </strong>

                        </td>



                        <td>

                            ${formatNumber(
                                minimum
                            )}

                        </td>



                        <td>

                            <span
                                class="required">

                                ${formatNumber(
                                    required
                                )}

                            </span>

                        </td>



                        <td>

                            <span
                                class="badge
                                ${isZero
                                    ? "zero"
                                    : "low"}">

                                ${isZero
                                    ? "ZERO STOCK"
                                    : "LOW STOCK"}

                            </span>

                        </td>


                    </tr>

                `;

            }

        ).join("");

};



/* =========================
   UPDATE STATISTICS
========================= */


function updateStats(){


    const zero =

        materials.filter(

            item =>

                Number(
                    item.stock || 0
                ) <= 0

        ).length;



    const low =

        materials.filter(

            item => {


                const stock =

                    Number(
                        item.stock || 0
                    );


                const minimum =

                    Number(
                        item.minimum || 0
                    );


                return (

                    stock > 0

                    &&

                    minimum > 0

                    &&

                    stock <= minimum

                );

            }

        ).length;



    document
        .getElementById(
            "zeroCount"
        )
        .textContent =
        zero;



    document
        .getElementById(
            "lowCount"
        )
        .textContent =
        low;



    document
        .getElementById(
            "totalCount"
        )
        .textContent =
        zero + low;

}



/* =========================
   ERROR MESSAGE
========================= */


function showError(message){


    const box =

        document
            .getElementById(
                "alertBox"
            );


    box.textContent =
        message;


    box.style.display =
        "block";

}



/* =========================
   SAFE TEXT
========================= */


function safe(value){


    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================
   NUMBER FORMAT
========================= */


function formatNumber(value){


    const number =
        Number(value || 0);


    return number.toLocaleString(
        "en-US",
        {
            maximumFractionDigits:2
        }
    );

}


</script>

</body>
</html>
