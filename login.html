<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LP-Store | Login</title>

    <meta name="description"
          content="LP-Store Facility Management & Store Intelligence">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #0f172a;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            border-radius: 24px;

            padding: 32px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.30);
        }

        .logo {
            width: 68px;
            height: 68px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #2563eb;
            color: #ffffff;

            border-radius: 18px;

            font-size: 24px;
            font-weight: 800;
        }

        h1 {
            text-align: center;

            color: #0f172a;

            font-size: 27px;

            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;

            color: #334155;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 11px;

            background: #ffffff;

            color: #0f172a;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;

            border: 0;

            padding: 14px;

            background: #2563eb;

            color: #ffffff;

            border-radius: 11px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 16px;

            padding: 13px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            background: #fef2f2;

            color: #b91c1c;

            border: 1px solid #fecaca;
        }

        .message.success {
            display: block;

            background: #f0fdf4;

            color: #15803d;

            border: 1px solid #bbf7d0;
        }

        .security {
            margin-top: 24px;

            text-align: center;

            color: #94a3b8;

            font-size: 11px;

            line-height: 1.6;
        }

        .back {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: #64748b;

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: #2563eb;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-card {
                padding: 26px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>


<body>

<div class="login-card">

    <!-- LP LOGO -->

    <div class="logo">
        LP
    </div>


    <!-- TITLE -->

    <h1>
        LP-Store
    </h1>

    <p class="subtitle">
        Facility Management & Store Intelligence
    </p>


    <!-- LOGIN FORM -->

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            id="loginButton"
            class="login-button">

            Login

        </button>

    </form>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">
    </div>


    <div class="security">

        🔐 Authorized users only.<br>

        LP-Store Facility Management System

    </div>


    <a
        href="index.html"
        class="back">

        ← Back to Website

    </a>

</div>


<!-- =====================================================
     FIREBASE SDK
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>


<script>

    /* =====================================================
       FIREBASE CONFIG
    ===================================================== */

    const firebaseConfig = {

        apiKey:
            "AIzaSyBDzbv1fTRPxfjmj3Nz4svl7ALWWARBuY0o",

        authDomain:
            "lp-store-23212.firebaseapp.com",

        projectId:
            "lp-store-23212",

        storageBucket:
            "lp-store-23212.firebasestorage.app",

        messagingSenderId:
            "200245726085",

        appId:
            "1:200245726085:web:846b39a873c06a1ebc12ec",

        measurementId:
            "G-51Q3ZZJQJD"

    };


    /* =====================================================
       INITIALIZE FIREBASE
    ===================================================== */

    firebase.initializeApp(firebaseConfig);


    /* =====================================================
       AUTHENTICATION
    ===================================================== */

    const auth = firebase.auth();


    /* =====================================================
       HTML ELEMENTS
    ===================================================== */

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    /* =====================================================
       CHECK LOGIN STATUS
    ===================================================== */

    auth.onAuthStateChanged(function(user) {

        if (user) {

            window.location.href =
                "dashboard.html";

        }

    });


    /* =====================================================
       LOGIN
    ===================================================== */

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const password =
                document
                .getElementById("password")
                .value;


            /* Check fields */

            if (!email || !password) {

                showError(
                    "Please enter your email and password."
                );

                return;

            }


            /* Disable button */

            loginButton.disabled = true;

            loginButton.textContent =
                "Signing in...";


            hideMessage();


            try {

                /* Firebase Email/Password Login */

                await auth.signInWithEmailAndPassword(
                    email,
                    password
                );


                /* Successful */

                showSuccess(
                    "Login successful. Opening LP-Store..."
                );


                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 800);


            }

            catch (error) {

                console.error(
                    "Firebase Login Error:",
                    error
                );


                let errorMessage =
                    "Login failed.";


                switch (error.code) {


                    case "auth/invalid-credential":

                        errorMessage =
                            "Invalid email or password.";

                        break;


                    case "auth/user-not-found":

                        errorMessage =
                            "User not found in Firebase.";

                        break;


                    case "auth/wrong-password":

                        errorMessage =
                            "Incorrect password.";

                        break;


                    case "auth/invalid-email":

                        errorMessage =
                            "Invalid email address.";

                        break;


                    case "auth/user-disabled":

                        errorMessage =
                            "This user account is disabled.";

                        break;


                    case "auth/too-many-requests":

                        errorMessage =
                            "Too many login attempts. Please try again later.";

                        break;


                    case "auth/operation-not-allowed":

                        errorMessage =
                            "Email/Password authentication is not enabled.";

                        break;


                    case "auth/network-request-failed":

                        errorMessage =
                            "Network error. Please check your internet connection.";

                        break;


                    default:

                        errorMessage =
                            error.code +
                            " - " +
                            error.message;

                        break;

                }


                showError(errorMessage);


                /* Enable button again */

                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";

            }

        }
    );


    /* =====================================================
       SHOW ERROR
    ===================================================== */

    function showError(text) {

        message.textContent = text;

        message.className =
            "message error";

    }


    /* =====================================================
       SHOW SUCCESS
    ===================================================== */

    function showSuccess(text) {

        message.textContent = text;

        message.className =
            "message success";

    }


    /* =====================================================
       HIDE MESSAGE
    ===================================================== */

    function hideMessage() {

        message.textContent = "";

        message.className =
            "message";

    }

</script>

</body>
</html>
