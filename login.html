<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBDzbv1fTRpXfmj3Nz4svl7ALWWARBuY0o",
    authDomain: "lp-store-23212.firebaseapp.com",
    projectId: "lp-store-23212",
    storageBucket: "lp-store-23212.firebasestorage.app",
    messagingSenderId: "200245726085",
    appId: "1:200245726085:web:846b39a873c06a1ebc12ec",
    measurementId: "G-51Q3ZZJQJD"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

loginForm.addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginButton.disabled = true;
    loginButton.textContent = "Signing in...";

    try {
        await auth.signInWithEmailAndPassword(email, password);

        message.className = "message success";
        message.textContent = "Login successful. Opening LP-Store...";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 700);

    } catch (error) {

        console.error(error);

        message.className = "message error";

        if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found"
        ) {
            message.textContent =
                "Invalid email or password.";
        } else {
            message.textContent =
                error.code + " - " + error.message;
        }

        loginButton.disabled = false;
        loginButton.textContent = "Sign In to LP-Store";
    }
});
</script>
