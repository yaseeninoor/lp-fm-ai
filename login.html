<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LP-Store | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Arial, sans-serif;

            background: #0f172a;
            color: #0f172a;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 22px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #2563eb;
            color: white;

            border-radius: 17px;

            font-size: 22px;
            font-weight: 800;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #cbd5e1;
            border-radius: 10px;

            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;
            border: 0;

            padding: 14px;

            background: #2563eb;
            color: white;

            border-radius: 10px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .message {
            display: none;

            margin-top: 15px;
            padding: 12px;

            border-radius: 9px;

            font-size: 12px;
            line-height: 1.5;
        }

        .error {
            background: #fef2f2;
            color: #b91c1c;
        }

        .info {
            margin-top: 22px;
            text-align: center;

            color: #94a3b8;
            font-size: 11px;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 18px;

            color: #64748b;
            text-decoration: none;

            font-size: 12px;
        }

        .back:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        LP
    </div>

    <h1>LP-Store</h1>

    <p class="subtitle">
        Facility Management & Store Intelligence
    </p>


    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-button">

            Login

        </button>

    </form>


    <div
        id="message"
        class="message error">
    </div>


    <p class="info">

        Authorized users only.<br>
        LP-Store Facility Management System

    </p>


    <a
        href="index.html"
        class="back">

        ← Back to Website

    </a>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");


        if (!email || !password) {

            message.style.display = "block";

            message.textContent =
                "Please enter your email and password.";

            return;
        }


        /*
         * Firebase Authentication will be connected here
         * in the next step.
         */

        message.style.display = "block";

        message.textContent =
            "Firebase Authentication is not connected yet.";

    });

</script>

</body>
</html>
