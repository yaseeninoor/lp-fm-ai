<!doctype html>
<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073b31"><title>Yaseeni Noor | Secure Account</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#17634d55,transparent 35%),linear-gradient(135deg,#061d19,#0c3028 55%,#061d19);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}.top{padding:20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:1px}.brand small{display:block;color:#d9bd78;font-size:10px;letter-spacing:2px}.secure{font-size:11px;color:#b7c9c0}.main{flex:1;display:grid;place-items:center;padding:16px}.card{width:min(100%,480px);padding:30px 24px;background:#0b2924ee;border:1px solid #ffffff20;border-radius:24px;box-shadow:0 25px 70px #0007}.mark{text-align:center;font-size:36px;color:#e6c978}.title{text-align:center;margin:8px 0 22px}.title h1{font-size:24px;margin:0 0 7px}.title p{color:#a9beb4;font-size:13px;margin:0}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:18px}.mode{padding:11px 4px;border:1px solid #ffffff22;border-radius:10px;background:#ffffff09;color:#e7eee9;font-size:12px;font-weight:700}.mode.active{background:#d9bd78;color:#17342a;border-color:#d9bd78}.field{margin:13px 0}.field label{display:block;font-size:12px;color:#d6e2db;font-weight:700;margin-bottom:7px}.field input{width:100%;height:48px;border:1px solid #ffffff28;border-radius:10px;background:#ffffff0c;color:#fff;padding:0 13px;font-size:14px;outline:none}.field input:focus{border-color:#d9bd78;box-shadow:0 0 0 3px #d9bd7822}.hint{font-size:11px;color:#9db2a8;line-height:1.6}.primary,.secondary{width:100%;height:49px;border:0;border-radius:11px;font-weight:800;font-size:14px;cursor:pointer}.primary{background:linear-gradient(120deg,#f2dda0,#b58b3c);color:#183329;margin-top:12px}.secondary{background:#ffffff10;color:#f1dfb2;border:1px solid #ffffff25;margin-top:10px}.primary:disabled{opacity:.6}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:12px;line-height:1.6}.msg.error{display:block;background:#7f1d1d44;color:#ffc5c5;border:1px solid #f8717155}.msg.ok{display:block;background:#14532d55;color:#bbf7d0;border:1px solid #4ade8055}.foot{text-align:center;color:#78948a;font-size:10px;padding:15px}.hidden{display:none!important}.back{display:block;text-align:center;color:#cbb67e;text-decoration:none;font-size:12px;margin-top:17px}
</style></head><body>
<header class="top"><div class="brand">YASEENIS <small>NOOR PORTAL</small></div><div class="secure">🔒 Secure Firebase Login</div></header>
<main class="main"><section class="card"><div class="mark">☾ ✦</div><div class="title"><h1>NOOR PORTAL ACCOUNT</h1><p id="subtitle">உங்கள் கணக்கில் உள்நுழையுங்கள்</p></div>
<div class="modes"><button class="mode active" data-mode="user">👤 User</button><button class="mode" data-mode="admin">🛡️ Admin</button><button class="mode" data-mode="superadmin">👑 Super Admin</button></div>
<form id="authForm">
<div id="registerFields" class="hidden">
<div class="field"><label for="fullName">முழுப் பெயர்</label><input id="fullName" autocomplete="name" maxlength="80" placeholder="உங்கள் முழுப் பெயர்"></div>
<div class="field"><label for="phone">மொபைல் எண்</label><input id="phone" type="tel" autocomplete="tel" maxlength="20" placeholder="+971 5X XXX XXXX"></div>
<p class="hint">மொபைல் எண் தொடர்பு விவரமாகச் சேமிக்கப்படும்; இந்தப் பதிவில் SMS OTP சரிபார்ப்பு செய்யப்படவில்லை.</p>
</div>
<div class="field"><label for="email">Email முகவரி</label><input id="email" type="email" autocomplete="username" required placeholder="name@example.com"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="குறைந்தது 6 எழுத்துகள்"></div>
<button class="primary" id="submitBtn" type="submit">Login</button>
<button class="secondary" id="registerBtn" type="button">புதிய இலவச User Account உருவாக்கவும்</button>
<button class="secondary" id="forgotBtn" type="button">Password மறந்துவிட்டதா?</button>
<button class="secondary hidden" id="cancelRegister" type="button">Login-க்கு திரும்பு</button>
</form>
<div id="message" class="msg" role="status" aria-live="polite"></div>
<a class="back" href="index.html">← Noor Portal முகப்புக்குத் திரும்பு</a>
</section></main><footer class="foot">Yaseeni Noor · Secure Account System</footer>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBDzbv1fTRpXfmj3Nz4svl7ALWWARBuY0o",authDomain:"lp-store-23212.firebaseapp.com",projectId:"lp-store-23212",storageBucket:"lp-store-23212.firebasestorage.app",messagingSenderId:"200245726085",appId:"1:200245726085:web:846b39a873c06a1ebc12ec"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const $=id=>document.getElementById(id);let mode="user",registering=false,busy=false;
function msg(t,kind="error"){$("message").textContent=t;$("message").className="msg "+kind}
function clearMsg(){$("message").textContent="";$("message").className="msg"}
function setMode(next){mode=next;document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));$("subtitle").textContent=mode==="user"?"உங்கள் கணக்கில் உள்நுழையுங்கள்":mode==="admin"?"அங்கீகரிக்கப்பட்ட நிர்வாகிகள் மட்டும்":"Super Admin பாதுகாப்பான உள்நுழைவு";$("registerBtn").classList.toggle("hidden",mode!=="user"||registering);clearMsg()}
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{setMode(b.dataset.mode);registering=false;renderForm()}));
function renderForm(){$("registerFields").classList.toggle("hidden",!registering);$("submitBtn").textContent=registering?"கணக்கை உருவாக்கவும்":mode==="user"?"Login":mode==="admin"?"Admin Login":"Super Admin Login";$("registerBtn").classList.toggle("hidden",registering||mode!=="user");$("forgotBtn").classList.toggle("hidden",registering);$("cancelRegister").classList.toggle("hidden",!registering);$("password").autocomplete=registering?"new-password":"current-password"}
$("registerBtn").onclick=()=>{registering=true;renderForm();clearMsg()};
$("cancelRegister").onclick=()=>{registering=false;renderForm();clearMsg()};
$("forgotBtn").onclick=async()=>{const email=$("email").value.trim();if(!email)return msg("முதலில் Email முகவரியை உள்ளிடுங்கள்.");try{await auth.sendPasswordResetEmail(email);msg("Password reset மின்னஞ்சல் அனுப்பப்பட்டது. Inbox-ஐச் சரிபார்க்கவும்.","ok")}catch(e){msg(friendly(e))}};
function friendly(e){const map={"auth/invalid-credential":"Email அல்லது Password தவறாக உள்ளது.","auth/email-already-in-use":"இந்த Email-ல் ஏற்கனவே கணக்கு உள்ளது.","auth/invalid-email":"சரியான Email முகவரியை உள்ளிடுங்கள்.","auth/weak-password":"வலுவான Password பயன்படுத்துங்கள் (குறைந்தது 6 எழுத்துகள்).","auth/too-many-requests":"பலமுறை முயற்சி செய்துள்ளீர்கள். சிறிது நேரம் கழித்து முயற்சிக்கவும்.","auth/operation-not-allowed":"Firebase Authentication-ல் Email/Password முறையை Enable செய்யவும்.","permission-denied":"Firebase Firestore Rules அனுமதி மறுத்தது. Rules deploy செய்யப்பட்டுள்ளதா பார்க்கவும்.","auth/network-request-failed":"இணைய இணைப்பைச் சரிபார்க்கவும்."};return map[e.code]||e.message||"செயல்பாட்டை முடிக்க முடியவில்லை."}
async function roleOf(user){const token=await user.getIdTokenResult(true);const claims=token.claims||{};return claims.role||(claims.superadmin?"superadmin":claims.admin?"admin":"user")}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();if(busy)return;busy=true;const submit=$("submitBtn");submit.disabled=true;clearMsg();try{
 const email=$("email").value.trim().toLowerCase(),password=$("password").value;
 if(registering){
  if(mode!=="user")throw new Error("புதிய கணக்குகள் User வகையில் மட்டுமே உருவாக்கலாம்.");
  const fullName=$("fullName").value.trim(),phone=$("phone").value.trim();
  if(fullName.length<2)throw new Error("முழுப் பெயரை உள்ளிடுங்கள்.");
  if(!/^\+?[0-9()\-\s]{7,20}$/.test(phone))throw new Error("சரியான மொபைல் எண்ணை உள்ளிடுங்கள். Country code உடன் கொடுக்கவும்.");
  const cred=await auth.createUserWithEmailAndPassword(email,password);
  await cred.user.updateProfile({displayName:fullName});
  await db.collection("users").doc(cred.user.uid).set({uid:cred.user.uid,fullName,phone,email,role:"user",createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});\n  await db.collection("chatProfiles").doc(cred.user.uid).set({name:fullName,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  await cred.user.sendEmailVerification();
  msg("கணக்கு உருவாக்கப்பட்டது. Email சரிபார்ப்பு இணைப்பை அனுப்பியுள்ளோம். உங்கள் கணக்கு User வகையில் உருவாக்கப்பட்டுள்ளது.","ok");
  setTimeout(()=>location.assign("account.html"),1000);
 }else{
  const cred=await auth.signInWithEmailAndPassword(email,password),role=await roleOf(cred.user);
  if(mode==="admin"&&!["admin","superadmin"].includes(role)){await auth.signOut();throw Object.assign(new Error("இந்தக் கணக்கிற்கு Admin அனுமதி வழங்கப்படவில்லை."),{code:"role-denied"})}
  if(mode==="superadmin"&&role!=="superadmin"){await auth.signOut();throw Object.assign(new Error("இந்தக் கணக்கிற்கு Super Admin அனுமதி வழங்கப்படவில்லை."),{code:"role-denied"})}
  msg("வெற்றிகரமாக உள்நுழைந்தீர்கள். திறக்கப்படுகிறது…","ok");
  location.assign(role==="admin"||role==="superadmin"?"admin/index.html":"account.html");
 }
 }catch(e){msg(e.code==="role-denied"?e.message:friendly(e))}finally{busy=false;submit.disabled=false}});
// Navigation is performed explicitly after successful registration or sign-in.
setMode("user");renderForm();
</script></body></html>
