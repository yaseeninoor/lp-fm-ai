<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><title>NOOR Call | Yaseenis</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(145deg,#064e46,#0b7668);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}.panel{width:min(100%,440px);text-align:center}.avatar{width:112px;height:112px;border-radius:50%;margin:20px auto;background:#d7eee5;color:#075e54;display:grid;place-items:center;font-size:42px;font-weight:800}.name{font-size:25px;font-weight:800}.sub{color:#c8e4dc;margin-top:8px;font-size:14px}.timer{font-size:14px;margin:24px 0;color:#d6eee7}.remote{width:100%;max-height:48vh;object-fit:cover;border-radius:18px;background:#183d37;display:none}.local{position:fixed;right:18px;top:18px;width:100px;height:140px;object-fit:cover;border-radius:13px;background:#183d37;display:none;border:1px solid #ffffff70}.actions{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-top:30px}.action{border:0;border-radius:50%;width:62px;height:62px;background:#ffffff24;color:#fff;font-size:23px}.action.end{background:#e83f50}.message{min-height:22px;color:#ffe5b8;font-size:13px;margin-top:20px}.hidden{display:none!important}
</style></head><body><main class="panel"><div id="avatar" class="avatar">N</div><div id="name" class="name">NOOR Chat</div><div id="sub" class="sub">Connecting call…</div><div id="timer" class="timer"></div><video id="remoteVideo" class="remote" autoplay playsinline></video><video id="localVideo" class="local" autoplay playsinline muted></video><audio id="remoteAudio" autoplay></audio><div class="actions" id="actions"><button class="action" id="muteBtn">🎙</button><button class="action" id="cameraBtn">📷</button><button class="action end" id="endBtn">✕</button></div><div class="message" id="message"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>
const cfg={apiKey:"AIzaSyBDzbv1fTRpXfmj3Nz4svl7ALWWARBuY0o",authDomain:"lp-store-23212.firebaseapp.com",projectId:"lp-store-23212",storageBucket:"lp-store-23212.firebasestorage.app",messagingSenderId:"200245726085",appId:"1:200245726085:web:846b39a873c06a1ebc12ec"};if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id),params=new URLSearchParams(location.search),rtcConfig={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
let me=null,pc=null,localStream=null,sessionRef=null,callType=params.get("type")==="video"?"video":"audio",caller=false,ended=false,remoteStream=new MediaStream(),timerStart=0,timerInterval=null,sessionUnsub=null,candidateUnsubs=[];
function say(t){$("message").textContent=t||""}function startTimer(){if(timerStart)return;timerStart=Date.now();timerInterval=setInterval(()=>{let n=Math.floor((Date.now()-timerStart)/1000);$("timer").textContent=String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")},1000)}
function clean(){if(ended)return;ended=true;if(sessionUnsub)sessionUnsub();candidateUnsubs.forEach(f=>f());if(timerInterval)clearInterval(timerInterval);if(pc)pc.close();if(localStream)localStream.getTracks().forEach(t=>t.stop())}
async function media(){if(!navigator.mediaDevices?.getUserMedia)throw Error("Camera/microphone needs HTTPS and a supported browser.");localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:callType==="video"?{facingMode:"user"}:false});if(callType==="video"){$("localVideo").srcObject=localStream;$("localVideo").style.display="block";$("remoteVideo").style.display="block"}}
function peer(){pc=new RTCPeerConnection(rtcConfig);remoteStream=new MediaStream();localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>{e.streams[0].getTracks().forEach(t=>remoteStream.addTrack(t));if(callType==="video")$("remoteVideo").srcObject=remoteStream;else $("remoteAudio").srcObject=remoteStream};pc.onconnectionstatechange=()=>{if(pc.connectionState==="connected"){startTimer();$("sub").textContent=callType==="video"?"Video call connected":"Audio call connected"}if(pc.connectionState==="failed")say("Could not connect on this network. A TURN relay may be required.")}}
async function watchCandidates(which){candidateUnsubs.push(sessionRef.collection(which).onSnapshot(s=>s.docChanges().forEach(ch=>{if(ch.type==="added"&&pc){let c=ch.doc.data().candidate;if(c)pc.addIceCandidate(new RTCIceCandidate(c)).catch(e=>say(e.message))}}),e=>say(e.message)))}
async function finish(state="ended"){if(sessionRef)try{await sessionRef.update({status:state,endedAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){}clean();$("sub").textContent=state==="rejected"?"Call declined":"Call ended";$("actions").classList.add("hidden");setTimeout(()=>location.href="chat.html",1200)}
async function outgoing(uid){caller=true;const s=await db.collection("chatProfiles").doc(uid).get(),target=s.exists?s.data():{};$("name").textContent=target.name||"NOOR Member";$("avatar").textContent=$("name").textContent[0];$("sub").textContent="Calling…";await media();peer();sessionRef=db.collection("callSessions").doc();pc.onicecandidate=e=>{if(e.candidate)sessionRef.collection("callerCandidates").add({uid:me.uid,candidate:e.candidate.toJSON()}).catch(x=>say(x.message))};const offer=await pc.createOffer();await sessionRef.set({callerUid:me.uid,callerName:me.displayName||"NOOR Member",calleeUid:uid,calleeName:target.name||"NOOR Member",participants:[me.uid,uid],callType,status:"ringing",offer:{type:offer.type,sdp:offer.sdp},createdAt:firebase.firestore.FieldValue.serverTimestamp()});await pc.setLocalDescription(offer);await watchCandidates("calleeCandidates");sessionUnsub=sessionRef.onSnapshot(async snap=>{if(!snap.exists)return;const d=snap.data();if(d.answer&&pc&&!pc.currentRemoteDescription)await pc.setRemoteDescription(new RTCSessionDescription(d.answer)).catch(e=>say(e.message));if(["rejected","ended","missed"].includes(d.status)&&!ended){clean();$("sub").textContent=d.status==="rejected"?"Call declined":"Call ended";$("actions").classList.add("hidden");setTimeout(()=>location.href="chat.html",1200)}})}
async function incoming(id){sessionRef=db.collection("callSessions").doc(id);const snap=await sessionRef.get();if(!snap.exists)throw Error("Call no longer exists.");const d=snap.data();if(d.calleeUid!==me.uid||d.status!=="ringing")throw Error("Call already ended.");callType=d.callType;$("name").textContent=d.callerName||"NOOR Member";$("avatar").textContent=$("name").textContent[0];$("sub").textContent="Connecting…";await media();peer();pc.onicecandidate=e=>{if(e.candidate)sessionRef.collection("calleeCandidates").add({uid:me.uid,candidate:e.candidate.toJSON()}).catch(x=>say(x.message))};await pc.setRemoteDescription(new RTCSessionDescription(d.offer));await watchCandidates("callerCandidates");const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await sessionRef.update({answer:{type:answer.type,sdp:answer.sdp},status:"active",acceptedAt:firebase.firestore.FieldValue.serverTimestamp()})}
$("muteBtn").onclick=()=>{const t=localStream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$("muteBtn").textContent=t.enabled?"🎙":"🔇"}};$("cameraBtn").onclick=()=>{const t=localStream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$("cameraBtn").textContent=t.enabled?"📷":"🚫"}};$("endBtn").onclick=()=>finish();
auth.onAuthStateChanged(async u=>{if(!u){location.replace("login.html");return}me=u;try{if(params.has("session"))await incoming(params.get("session"));else if(params.has("uid"))await outgoing(params.get("uid"));else throw Error("Call details missing.")}catch(e){say(e.message);$("sub").textContent="Unable to start call";$("actions").classList.add("hidden");if(caller&&sessionRef)finish("missed")}});
window.addEventListener("beforeunload",()=>{if(!ended&&sessionRef)sessionRef.update({status:"ended",endedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});clean()});
</script></body></html>
