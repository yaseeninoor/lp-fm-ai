name: Grant Noor Portal Admin Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grant-admin:
    name: Grant admin claim to the designated account
    runs-on: ubuntu-latest
    environment: firebase-admin
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Grant admin claim to designated UID
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: lp-store-23212
          ADMIN_UID: 3Mz2qCQX0YRUqNNjFbZP1pwerQ83
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Missing repository/environment secret FIREBASE_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          mkdir -p /tmp/noor-admin
          cd /tmp/noor-admin
          npm init -y >/dev/null
          npm install --silent firebase-admin
          cat > grant-admin.cjs <<'NODE'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');

          async function main() {
            const raw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
            const serviceAccount = JSON.parse(raw);
            if (serviceAccount.project_id !== process.env.FIREBASE_PROJECT_ID) {
              throw new Error('Service account project_id does not match the expected Firebase project.');
            }
            initializeApp({ credential: cert(serviceAccount), projectId: process.env.FIREBASE_PROJECT_ID });
            const auth = getAuth();
            const uid = process.env.ADMIN_UID;
            const user = await auth.getUser(uid);
            if (user.email !== 'yaseeninoor@gmail.com') {
              throw new Error('UID/email verification failed; no changes made.');
            }
            const existingClaims = user.customClaims || {};
            await auth.setCustomUserClaims(uid, { ...existingClaims, admin: true });
            console.log('Admin claim granted to the verified designated account.');
            console.log('Sign out and sign in again, or force-refresh the ID token, to receive the updated claim.');
          }
          main().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE
          node grant-admin.cjs
