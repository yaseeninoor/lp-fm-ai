name: Check NOOR PORTAL Expo project

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/check-expo-mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/check-expo-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate Expo config
        run: npx expo config --type public
