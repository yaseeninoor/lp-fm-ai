name: Grant Initial Noor Portal Super Admin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grant-super-admin:
    runs-on: ubuntu-latest
    environment: firebase-admin
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Grant Super Admin to the pre-approved owner account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: lp-store-23212
          SUPER_ADMIN_UID: 3Mz2qCQX0YRUqNNjFbZP1pwerQ83
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          mkdir -p /tmp/noor-admin && cd /tmp/noor-admin
          npm init -y >/dev/null
          npm install --silent firebase-admin
          cat > grant.cjs <<'NODE'
          const {initializeApp,cert}=require('firebase-admin/app');
          const {getAuth}=require('firebase-admin/auth');
          async function main(){
            const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
            if(sa.project_id!==process.env.FIREBASE_PROJECT_ID) throw new Error('Firebase project mismatch.');
            initializeApp({credential:cert(sa),projectId:process.env.FIREBASE_PROJECT_ID});
            const auth=getAuth(), user=await auth.getUser(process.env.SUPER_ADMIN_UID);
            if(user.email!=='yaseeninoor@gmail.com') throw new Error('Owner UID/email check failed. No claims changed.');
            await auth.setCustomUserClaims(user.uid,{...(user.customClaims||{}),admin:true,role:'superadmin',superadmin:true});
            console.log('Super Admin claim granted to verified owner account. Sign out and sign in again.');
          }
          main().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          node grant.cjs
